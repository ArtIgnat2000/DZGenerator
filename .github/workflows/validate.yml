name: Validate generator

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          p = pathlib.Path('V-labs-generator.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', p, re.S)
          if not m:
              print('::error::No <script> block found in V-labs-generator.html')
              sys.exit(1)
          pathlib.Path('/tmp/check.js').write_text(m.group(1), encoding='utf-8')
          print(f'Extracted {len(m.group(1))} chars of JS')
          PY
          node --check /tmp/check.js
          echo "JS syntax OK"

      - name: Check standalone (no CDN / external scripts)
        run: |
          if grep -qE '<script[^>]+src=' V-labs-generator.html; then
            echo "::error::External <script src=...> found — generator must stay standalone"
            exit 1
          fi
          if grep -qE '<link[^>]+href="https?://' V-labs-generator.html; then
            echo "::error::External stylesheet found — generator must stay standalone"
            exit 1
          fi
          echo "No external scripts/styles — OK"

      - name: Check key invariants
        run: |
          set -e
          grep -q 'vlabs-homework-v1' V-labs-generator.html && echo "localStorage key OK"
          grep -q '520px' V-labs-generator.html && grep -q '980px' V-labs-generator.html && echo "Print size 520x980 OK"
          grep -q 'paginatePrint' V-labs-generator.html && echo "paginatePrint OK"
          grep -q 'const LESSONS=' V-labs-generator.html && echo "Lesson templates OK"
          grep -q 'const COURSES=' V-labs-generator.html && echo "Course structure OK"
          COUNT=$(grep -o 'data:image' V-labs-generator.html | wc -l)
          echo "Embedded previews: $COUNT"
          test "$COUNT" -ge 6
          for f in previews/slovo.jpg previews/chislo.jpg previews/buffalo.jpg previews/oil.jpg previews/bukvarinsk.jpg previews/ovz.jpg; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
          echo "All 6 source previews present"

      - name: Check release version
        run: |
          set -e
          FILE_VER=$(cat VERSION | tr -d '[:space:]')
          HTML_VER=$(grep -oE "const VERSION='[^']+'" V-labs-generator.html | head -1 | sed "s/const VERSION='//;s/'//")
          echo "VERSION file: $FILE_VER"
          echo "Generator VERSION: $HTML_VER"
          test -n "$FILE_VER" || { echo "::error::VERSION file is empty"; exit 1; }
          test -n "$HTML_VER" || { echo "::error::VERSION const not found in generator"; exit 1; }
          test "$FILE_VER" = "$HTML_VER" || { echo "::error::VERSION mismatch: file=$FILE_VER html=$HTML_VER"; exit 1; }
          grep -q 'id="ver"' V-labs-generator.html && echo "Version badge on site OK"

      - name: Check lesson pages are up to date
        run: |
          set -e
          node scripts/build-lessons.js --check
          for i in 1 2 3 4 5 6 7 8; do
            test -f "lessons/$i.html" || { echo "::error::Missing lessons/$i.html"; exit 1; }
          done
          test -f lessons/index.html || { echo "::error::Missing lessons/index.html"; exit 1; }
          for i in 1 2 3 4 5 6 7 8; do
            test -f "lessons/course-2/$i.html" || { echo "::error::Missing lessons/course-2/$i.html"; exit 1; }
          done
          test -f lessons/course-2/index.html || { echo "::error::Missing lessons/course-2/index.html"; exit 1; }
          grep -q 'href="lessons/index.html"' V-labs-generator.html && echo "Generator links to lesson pages OK"
          echo "Lesson pages OK"

      - name: Check course structure
        run: |
          node - <<'JS'
          const fs = require('fs');
          const src = fs.readFileSync('V-labs-generator.html', 'utf8');
          const a = src.indexOf('const LESSONS='), b = src.indexOf('\nconst $=id=>', a);
          const { LESSONS, COURSES } = new Function(src.slice(a, b) + '\nreturn {LESSONS, COURSES};')();
          const fail = m => { console.error('::error::' + m); process.exit(1); };
          if (COURSES.length !== 3) fail(`expected 3 courses, got ${COURSES.length}`);
          const [c1, c2, c3] = COURSES;
          if (c1.n !== 1 || c1.lessons.length !== 8) fail('course 1 must keep its 8 lessons');
          if (c2.n !== 2 || c2.lessons.length !== 8) fail('course 2 must have 8 lessons');
          if (!c3.coming || c3.lessons.length !== 0) fail('course 3 must stay a placeholder');
          if (c1.lessons !== LESSONS) fail('course 1 must use the original LESSONS array');
          const seen = new Set();
          for (const c of COURSES) for (const l of c.lessons) {
            const key = `${c.n}-${l.n}`, where = `lesson ${key}`;
            if (seen.has(key)) fail(`${where}: duplicate lesson key`); seen.add(key);
            if (l.course !== c.n) fail(`${where}: lesson.course is ${l.course}`);
            if (!/^#[0-9A-F]{6}$/i.test(l.color) || !/^#[0-9A-F]{6}$/i.test(l.dark)) fail(`${where}: color/dark must be #RRGGBB`);
            for (const k of ['goal', 'blocks', 'practice', 'idea', 'work']) if (typeof l[k] !== 'string' || !l[k].trim()) fail(`${where}: field "${k}" is empty`);
            for (const k of ['hook', 'intro', 'play', 'find', 'change', 'more', 'bring', 'key'])
              if (typeof l.prep?.[k] !== 'string' || !l.prep[k].trim()) fail(`${where}: mission field "${k}" is empty`);
            if (!/\[[^\]]+\]/.test(l.prep.find)) fail(`${where}: step "find" must name a block in [brackets]`);
            if (l.prep.bring.split('\n').filter(x => x.trim()).length !== 3) fail(`${where}: "bring" must have 3 lines`);
          }
          for (const l of c2.lessons) {
            const where = `course 2 lesson ${l.n}`;
            if (!l.file || !l.games?.length) fail(`${where}: own game file and title are required`);
            if (l.warmup) fail(`${where}: course 2 has its own demo game, warmup is no longer used`);
            for (const k of ['look', 'own']) if (typeof l.solve?.[k] !== 'string' || !l.solve[k].trim()) fail(`${where}: solve.${k} is empty`);
            const page = fs.readFileSync(`lessons/course-2/${l.n}.html`, 'utf8');
            if (!page.includes(`../games/${l.file}`)) fail(`${where}: page has no demo game link`);
            if (!page.includes(`../practice/${l.file.replace('.sb3', '')}-start.sb3`)) fail(`${where}: page has no starter link`);
            if (page.includes('-solution.sb3')) fail(`${where}: page links to a solution`);
            if (!page.includes(`?course=2&lesson=${l.n}`)) fail(`${where}: page has no teacher link with the course`);
          }
          const index = fs.readFileSync('lessons/index.html', 'utf8');
          if (!index.includes('course-2/index.html')) fail('lessons/index.html does not link to course 2');
          console.log('Courses: 3, lessons: 8 + 8, course 2 games and pages OK');
          JS

      - name: Check Scratch game packages
        run: |
          python3 -m py_compile scripts/build-games.py
          python3 - <<'PY'
          import glob, json, zipfile
          THEMES = {'01-events': 'event', '02-motion': 'motion', '03-looks': 'looks', '04-sound': 'sound',
                    '05-control': 'control', '06-sensing': 'sensing', '07-operators': 'operator', '08-data': 'data'}
          files = sorted(glob.glob('lessons/games/*.sb3'))
          assert len(files) == 8, f'Expected 8 Scratch projects, got {len(files)}'
          for path in files:
              stem = path.split('/')[-1][:-4]
              with zipfile.ZipFile(path) as archive:
                  project = json.loads(archive.read('project.json'))
                  names = set(archive.namelist())
                  assert len(project['targets']) >= 3, f'{path}: missing sprites'
                  assert project['extensions'] == [], f'{path}: unexpected Scratch extensions'
                  opcodes = []
                  for target in project['targets']:
                      for asset in target['costumes'] + target['sounds']:
                          assert asset['md5ext'] in names, f'{path}: missing {asset["md5ext"]}'
                          if asset['dataFormat'] == 'svg':
                              svg = archive.read(asset['md5ext']).decode('utf-8')
                              for unsupported in ('<text', '<filter', 'Gradient', 'rx='):
                                  assert unsupported not in svg, f'{path}: unsupported SVG feature {unsupported}'
                      for block in target['blocks'].values():
                          assert not block['opcode'].startswith('procedures_'), f'{path}: custom Scratch block'
                          if not block['shadow']:
                              opcodes.append(block['opcode'])
                      notes = [c['text'] for c in target['comments'].values()]
                      assert any('V Labs' in text for text in notes), f'{path}: {target["name"]} has no V Labs note'
                  badge = [t for t in project['targets'] if t['name'] == 'V Labs']
                  assert len(badge) == 1 and badge[0]['visible'] and badge[0]['costumes'], f'{path}: no V Labs badge sprite'
                  badge_ops = {b['opcode'] for b in badge[0]['blocks'].values()}
                  assert {'event_whenflagclicked', 'looks_show', 'looks_gotofrontback'} <= badge_ops, f'{path}: V Labs badge is not kept on stage'
                  themed = sum(op.startswith(THEMES[stem] + '_') for op in opcodes)
                  assert len(opcodes) >= 100, f'{path}: only {len(opcodes)} blocks'
                  assert themed >= 30, f'{path}: only {themed} blocks of the lesson topic'
                  print(f'{path}: {len(project["targets"])} targets, {len(opcodes)} blocks, {themed} on the lesson topic, V Labs badge OK')
          PY

      - name: Check course 2 games and starters
        run: |
          python3 -m py_compile scripts/build-course2.py
          python3 scripts/build-course2.py --check
          python3 - <<'PY'
          import glob, json, zipfile
          from pathlib import Path
          STEMS = ['01-chase', '02-platform', '03-maze', '04-catcher',
                   '05-pursuit', '06-shooter', '07-quest', '08-own-game']
          games = sorted(glob.glob('lessons/course-2/games/*.sb3'))
          starts = sorted(glob.glob('lessons/course-2/practice/*-start.sb3'))
          assert len(games) == 8, f'Expected 8 course 2 games, got {len(games)}'
          assert len(starts) == 8, f'Expected 8 course 2 starters, got {len(starts)}'

          def load(path, badge_script=True):
              with zipfile.ZipFile(path) as archive:
                  project = json.loads(archive.read('project.json'))
                  names = set(archive.namelist())
                  assert project['extensions'] == [], f'{path}: unexpected Scratch extensions'
                  for target in project['targets']:
                      for asset in target['costumes'] + target['sounds']:
                          assert asset['md5ext'] in names, f'{path}: missing {asset["md5ext"]}'
                          if asset['dataFormat'] == 'svg':
                              svg = archive.read(asset['md5ext']).decode('utf-8')
                              for unsupported in ('<text', '<filter', 'Gradient', 'rx='):
                                  assert unsupported not in svg, f'{path}: unsupported SVG feature {unsupported}'
                      notes = [c['text'] for c in target['comments'].values()]
                      assert any('V Labs' in text for text in notes), f'{path}: {target["name"]} has no V Labs note'
                  badge = [t for t in project['targets'] if t['name'] == 'V Labs']
                  assert len(badge) == 1 and badge[0]['visible'] and badge[0]['costumes'], f'{path}: no V Labs badge sprite'
                  ops = {b['opcode'] for b in badge[0]['blocks'].values()}
                  if badge_script:
                      assert {'event_whenflagclicked', 'looks_show', 'looks_gotofrontback'} <= ops, f'{path}: V Labs badge is not kept on stage'
                  return project

          def look(project):
              return [(t['name'], [c['md5ext'] for c in t['costumes']], [s['md5ext'] for s in t['sounds']]) for t in project['targets']]

          for stem in STEMS:
              game_path = f'lessons/course-2/games/{stem}.sb3'
              start_path = f'lessons/course-2/practice/{stem}-start.sb3'
              game, start = load(game_path), load(start_path, badge_script=False)
              assert look(game) == look(start), f'{stem}: the starter and the game have different sprites, costumes or sounds'
              for target in start['targets']:
                  assert not target['blocks'], f'{stem}: the starter has blocks in {target["name"]}'
                  assert not target['variables'] and not target['lists'] and not target['broadcasts'], f'{stem}: the starter has data in {target["name"]}'
                  if not target['isStage']:
                      assert target['visible'], f'{stem}: {target["name"]} is hidden in the starter'
              notes = ' '.join(c['text'] for t in start['targets'] for c in t['comments'].values())
              assert 'Заготовка' in notes and 'Что собираем на уроке' in notes, f'{stem}: the starter has no lesson steps'
              game_notes = ' '.join(c['text'] for t in game['targets'] for c in t['comments'].values())
              assert 'Игра «' in game_notes, f'{stem}: the game notes are not marked as a demo game'
              opcodes = [b['opcode'] for t in game['targets'] for b in t['blocks'].values() if not b['shadow']]
              assert len(opcodes) >= 40, f'{stem}: the game has only {len(opcodes)} blocks'
              assert not any(op.startswith('procedures_') for op in opcodes), f'{stem}: custom Scratch block'
              png = Path(f'lessons/course-2/games/{stem}.png')
              assert png.exists(), f'{stem}: missing game shot'
              h = png.read_bytes()
              assert h[1:4] == b'PNG' and int.from_bytes(h[16:20], 'big') == 960 and int.from_bytes(h[20:24], 'big') == 720, f'{png}: must be 960x720'
              assert len(h) <= 200000, f'{png}: larger than 200 KB'
              print(f'{stem}: game {len(opcodes)} blocks, starter {len(start["targets"])} targets without program, shot OK')
          PY

      - name: Check practice starters and solutions
        run: |
          python3 -m py_compile scripts/build-practice.py
          python3 scripts/build-practice.py --check
          python3 - <<'PY'
          import glob, json, zipfile
          STEMS = ['01-events', '02-motion', '03-looks', '04-sound', '05-control', '06-sensing', '07-operators', '08-data']
          files = sorted(glob.glob('lessons/practice/*.sb3'))
          assert len(files) == 16, f'Expected 16 practice projects, got {len(files)}'

          def load(path):
              with zipfile.ZipFile(path) as archive:
                  project = json.loads(archive.read('project.json'))
                  names = set(archive.namelist())
                  assert project['extensions'] == [], f'{path}: unexpected Scratch extensions'
                  for target in project['targets']:
                      for asset in target['costumes'] + target['sounds']:
                          assert asset['md5ext'] in names, f'{path}: missing {asset["md5ext"]}'
                          if asset['dataFormat'] == 'svg':
                              svg = archive.read(asset['md5ext']).decode('utf-8')
                              for unsupported in ('<text', '<filter', 'Gradient', 'rx='):
                                  assert unsupported not in svg, f'{path}: unsupported SVG feature {unsupported}'
                      notes = [c['text'] for c in target['comments'].values()]
                      assert any('V Labs' in text for text in notes), f'{path}: {target["name"]} has no V Labs note'
                  return project

          def look(project):
              return [(t['name'], [c['md5ext'] for c in t['costumes']], [s['md5ext'] for s in t['sounds']]) for t in project['targets']]

          for stem in STEMS:
              start, done = load(f'lessons/practice/{stem}-start.sb3'), load(f'lessons/practice/{stem}-solution.sb3')
              assert look(start) == look(done), f'{stem}: the starter and the solution have different sprites, costumes or sounds'
              for target in start['targets']:
                  assert not target['blocks'], f'{stem}: the starter has blocks in {target["name"]}'
                  assert not target['variables'] and not target['lists'] and not target['broadcasts'], f'{stem}: the starter has data in {target["name"]}'
                  if not target['isStage']:
                      assert target['visible'], f'{stem}: {target["name"]} is hidden in the starter'
              notes = ' '.join(c['text'] for t in start['targets'] for c in t['comments'].values())
              assert 'Заготовка' in notes and 'Что собираем на уроке' in notes, f'{stem}: the starter has no practice steps'
              opcodes = [b['opcode'] for t in done['targets'] for b in t['blocks'].values() if not b['shadow']]
              assert 10 <= len(opcodes) <= 60, f'{stem}: the solution has {len(opcodes)} blocks, expected a lesson-sized program'
              assert not any(op.startswith('procedures_') for op in opcodes), f'{stem}: custom Scratch block'
              assert all('Разгадка' in c['text'] for t in done['targets'] for c in t['comments'].values()), f'{stem}: a solution note is not marked'
              print(f'{stem}: starter {len(start["targets"])} targets without program, solution {len(opcodes)} blocks')
          PY
          node - <<'JS'
          const fs = require('fs');
          const src = fs.readFileSync('V-labs-generator.html', 'utf8');
          const a = src.indexOf('const LESSONS='), b = src.indexOf('\n];', a);
          const LESSONS = new Function(src.slice(a, b + 3) + '\nreturn LESSONS;')();
          const fail = m => { console.error('::error::' + m); process.exit(1); };
          for (const l of LESSONS) {
            const where = `lesson ${l.n}`, stem = l.file.replace('.sb3', '');
            for (const kind of ['start', 'solution'])
              if (!fs.existsSync(`lessons/practice/${stem}-${kind}.sb3`)) fail(`${where}: missing lessons/practice/${stem}-${kind}.sb3`);
            if (typeof l.work !== 'string' || !l.work.trim()) fail(`${where}: practice name "work" is empty`);
            for (const k of ['look', 'own'])
              if (typeof l.solve?.[k] !== 'string' || !l.solve[k].trim()) fail(`${where}: solution letter field "${k}" is empty`);
            // Разгадка до урока не выдаётся: на странице урока есть заготовка, но нет готового проекта практики.
            const page = fs.readFileSync(`lessons/${l.n}.html`, 'utf8');
            if (!page.includes(`practice/${stem}-start.sb3`)) fail(`${where}: the lesson page has no starter link`);
            if (page.includes('-solution.sb3')) fail(`${where}: the lesson page links to the solution`);
            console.log(`${where}: practice "${l.work}", starter and solution OK`);
          }
          if (fs.readFileSync('lessons/index.html', 'utf8').includes('-solution.sb3')) fail('lessons/index.html links to a solution');
          JS

      - name: Check lesson missions and game shots
        run: |
          python3 -m py_compile scripts/build-shots.py
          python3 scripts/check-missions.py
          node - <<'JS'
          const fs = require('fs');
          const src = fs.readFileSync('V-labs-generator.html', 'utf8');
          const a = src.indexOf('const LESSONS='), b = src.indexOf('\n];', a);
          const LESSONS = new Function(src.slice(a, b + 3) + '\nreturn LESSONS;')();
          const fail = m => { console.error('::error::' + m); process.exit(1); };
          for (const l of LESSONS) {
            const where = `lesson ${l.n}`;
            if (!/^#[0-9A-F]{6}$/i.test(l.color) || !/^#[0-9A-F]{6}$/i.test(l.dark)) fail(`${where}: color/dark must be #RRGGBB`);
            for (const k of ['hook', 'intro', 'play', 'find', 'change', 'more', 'bring', 'key'])
              if (typeof l.prep?.[k] !== 'string' || !l.prep[k].trim()) fail(`${where}: mission field "${k}" is empty`);
            if (!/\[[^\]]+\]/.test(l.prep.find)) fail(`${where}: step "find" must name a block in [brackets]`);
            if (l.prep.bring.split('\n').filter(x => x.trim()).length !== 3) fail(`${where}: "bring" must have 3 lines`);
            const png = `lessons/games/${l.file.replace('.sb3', '.png')}`;
            if (!fs.existsSync(png)) fail(`${where}: missing game shot ${png}`);
            const h = fs.readFileSync(png);
            if (h.toString('latin1', 1, 4) !== 'PNG' || h.readUInt32BE(16) !== 960 || h.readUInt32BE(20) !== 720) fail(`${png}: must be a 960x720 PNG`);
            if (h.length > 200000) fail(`${png}: larger than 200 KB`);
            console.log(`${where}: mission "${l.prep.hook}", shot ${png} OK`);
          }
          JS

      - name: Check generator file size
        run: |
          SIZE=$(stat -c%s V-labs-generator.html)
          echo "V-labs-generator.html: $SIZE bytes"
          if [ "$SIZE" -gt 2000000 ]; then
            echo "::warning::Generator is larger than 2 MB"
          fi
