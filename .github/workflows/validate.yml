name: Validate generator

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          p = pathlib.Path('V-labs-generator.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', p, re.S)
          if not m:
              print('::error::No <script> block found in V-labs-generator.html')
              sys.exit(1)
          pathlib.Path('/tmp/check.js').write_text(m.group(1), encoding='utf-8')
          print(f'Extracted {len(m.group(1))} chars of JS')
          PY
          node --check /tmp/check.js
          echo "JS syntax OK"

      - name: Check standalone (no CDN / external scripts)
        run: |
          if grep -qE '<script[^>]+src=' V-labs-generator.html; then
            echo "::error::External <script src=...> found — generator must stay standalone"
            exit 1
          fi
          if grep -qE '<link[^>]+href="https?://' V-labs-generator.html; then
            echo "::error::External stylesheet found — generator must stay standalone"
            exit 1
          fi
          echo "No external scripts/styles — OK"

      - name: Check key invariants
        run: |
          set -e
          grep -q 'vlabs-homework-v1' V-labs-generator.html && echo "localStorage key OK"
          grep -q '520px' V-labs-generator.html && grep -q '980px' V-labs-generator.html && echo "Print size 520x980 OK"
          grep -q 'paginatePrint' V-labs-generator.html && echo "paginatePrint OK"
          grep -q 'const LESSONS=' V-labs-generator.html && echo "Lesson templates OK"
          COUNT=$(grep -o 'data:image' V-labs-generator.html | wc -l)
          echo "Embedded previews: $COUNT"
          test "$COUNT" -ge 6
          for f in previews/slovo.jpg previews/chislo.jpg previews/buffalo.jpg previews/oil.jpg previews/bukvarinsk.jpg previews/ovz.jpg; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
          echo "All 6 source previews present"

      - name: Check release version
        run: |
          set -e
          FILE_VER=$(cat VERSION | tr -d '[:space:]')
          HTML_VER=$(grep -oE "const VERSION='[^']+'" V-labs-generator.html | head -1 | sed "s/const VERSION='//;s/'//")
          echo "VERSION file: $FILE_VER"
          echo "Generator VERSION: $HTML_VER"
          test -n "$FILE_VER" || { echo "::error::VERSION file is empty"; exit 1; }
          test -n "$HTML_VER" || { echo "::error::VERSION const not found in generator"; exit 1; }
          test "$FILE_VER" = "$HTML_VER" || { echo "::error::VERSION mismatch: file=$FILE_VER html=$HTML_VER"; exit 1; }
          grep -q 'id="ver"' V-labs-generator.html && echo "Version badge on site OK"

      - name: Check lesson pages are up to date
        run: |
          set -e
          node scripts/build-lessons.js --check
          for i in 1 2 3 4 5 6 7 8; do
            test -f "lessons/$i.html" || { echo "::error::Missing lessons/$i.html"; exit 1; }
          done
          test -f lessons/index.html || { echo "::error::Missing lessons/index.html"; exit 1; }
          grep -q 'href="lessons/index.html"' V-labs-generator.html && echo "Generator links to lesson pages OK"
          echo "Lesson pages OK"

      - name: Check Scratch game packages
        run: |
          python3 -m py_compile scripts/build-games.py
          python3 - <<'PY'
          import glob, json, zipfile
          files = sorted(glob.glob('lessons/games/*.sb3'))
          assert len(files) == 8, f'Expected 8 Scratch projects, got {len(files)}'
          for path in files:
              with zipfile.ZipFile(path) as archive:
                  project = json.loads(archive.read('project.json'))
                  names = set(archive.namelist())
                  assert len(project['targets']) >= 2, f'{path}: missing sprites'
                  for target in project['targets']:
                      for asset in target['costumes'] + target['sounds']:
                          assert asset['md5ext'] in names, f'{path}: missing {asset["md5ext"]}'
                  print(f'{path}: valid project, {len(project["targets"])} targets')
          PY

      - name: Check generator file size
        run: |
          SIZE=$(stat -c%s V-labs-generator.html)
          echo "V-labs-generator.html: $SIZE bytes"
          if [ "$SIZE" -gt 2000000 ]; then
            echo "::warning::Generator is larger than 2 MB"
          fi
